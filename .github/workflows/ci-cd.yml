name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: "3.11"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
      fail-fast: false  # Continue testing other versions if one fails

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Run security check with bandit
      run: |
        pip install bandit
        bandit -r sentinel_log_aggregator/ -f json -o bandit-report.json || true
        bandit -r sentinel_log_aggregator/ || true
    
    - name: Run Safety (dependency vulnerability scan)
      run: |
        pip install safety
        safety check --output json > safety-report.json || true
    
    - name: Run pip-audit (official Python security audit)
      run: |
        pip install pip-audit
        pip-audit --format=json --output=pip-audit-report.json || true
    
    - name: Upload Bandit results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bandit-results-${{ matrix.python-version }}
        path: bandit-report.json

    - name: Upload Security Scan Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-scan-results-${{ matrix.python-version }}
        path: |
          safety-report.json
          pip-audit-report.json
    
    - name: Lint with flake8
      run: |
        flake8 sentinel_log_aggregator/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 sentinel_log_aggregator/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics
    
    - name: Format check with black
      run: |
        black --check --diff sentinel_log_aggregator/ tests/
    
    - name: Import sort check with isort
      run: |
        isort --check-only --diff sentinel_log_aggregator/ tests/
    
    # TODO: Re-enable mypy type checking after resolving type issues
    # See mypy_errors.txt and MYPY_TEMPORARILY_RELAXED.md for details
    # - name: Type check with mypy
    #   run: |
    #     mypy sentinel_log_aggregator/ --ignore-missing-imports
    
    - name: Test with pytest
      env:
        # Set mock Azure credentials for tests that need them
        AZURE_CLIENT_ID: "00000000-0000-0000-0000-000000000000"
        AZURE_TENANT_ID: "00000000-0000-0000-0000-000000000000"
        AZURE_CLIENT_SECRET: "fake-secret-for-testing"
      run: |
        pytest tests/ -v --cov=sentinel_log_aggregator --cov-report=xml --cov-report=html --cov-fail-under=20
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      if: matrix.python-version == env.PYTHON_VERSION
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: true

  integration-test:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Run integration tests
      env:
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      run: |
        pytest tests/ -v -m "integration" --tb=short

  build:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Build package
      run: |
        python -m build
    
    - name: Check package
      run: |
        twine check dist/*
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  security-scan:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@0.28.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'

  documentation:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,docs]"
    
    - name: Build documentation
      run: |
        sphinx-build -b html docs/ docs/_build/html
    
    - name: Prepare branch selector (main branch only)
      if: github.ref == 'refs/heads/main'
      run: |
        # Copy branch selector to root as index.html for main branch
        mkdir -p docs/_build/root
        cp docs/branch-selector.html docs/_build/root/index.html
    
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/_build/html
        destination_dir: ${{ github.ref_name }}  # Deploy to /main/ or /develop/ subfolder
        keep_files: true  # Keep other branch documentation
    
    - name: Deploy branch selector to root (main branch only)
      if: github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/_build/root
        keep_files: true

  release:
    runs-on: ubuntu-latest
    needs: [test, build, security-scan]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/
    
    - name: Extract release notes
      id: extract-release-notes
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        
        # Extract release notes from CHANGELOG.md
        python -c "
        import re
        with open('CHANGELOG.md', 'r') as f:
            content = f.read()
        
        # Find the section for this version
        pattern = rf'## \[{re.escape('$VERSION')}\].*?(?=## \[|\Z)'
        match = re.search(pattern, content, re.DOTALL)
        
        if match:
            release_notes = match.group(0)
            # Remove the version header
            release_notes = re.sub(rf'## \[{re.escape('$VERSION')}\].*?\n', '', release_notes)
            with open('release_notes.md', 'w') as f:
                f.write(release_notes.strip())
        else:
            with open('release_notes.md', 'w') as f:
                f.write(f'Release {\"$VERSION\"}')
        "
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
        body_path: release_notes.md
        draft: false
        prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Publish to PyPI
      if: "!contains(github.ref, 'alpha') && !contains(github.ref, 'beta') && !contains(github.ref, 'rc')"
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        pip install twine
        twine upload dist/*
    
    - name: Publish to Test PyPI (for pre-releases)
      if: contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc')
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
      run: |
        pip install twine
        twine upload --repository testpypi dist/*