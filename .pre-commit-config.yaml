# Pre-commit configuration for Microsoft Sentinel Log Aggregator
# Simplified to match GitHub Actions critical checks only
# Run: pre-commit install

repos:
  - repo: local
    hooks:
      # Black - AUTO-FIXES formatting issues
      - id: black
        name: black
        entry: black
        language: system
        types: [python]
        args: [--line-length=100, --target-version=py311]
      
      # isort - AUTO-FIXES import order
      - id: isort
        name: isort
        entry: isort
        language: system
        types: [python]
        args: [--profile=black, --line-length=100]
      
      # flake8 - Critical syntax/runtime errors only
      - id: flake8-critical
        name: flake8 (critical errors)
        entry: pwsh
        language: system
        types: [python]
        args: [-c, 'flake8 $args --max-line-length=100 --extend-ignore=E203,W503 --select=E9,F63,F7,F82']
        pass_filenames: true
      
      # Run tests before push (not on every commit)
      - id: pytest-check
        name: pytest
        entry: pytest
        language: system
        args: [tests/, --tb=short, -q, --maxfail=5, -x]
        types: [python]
        pass_filenames: false
        stages: [pre-push]

# Global configuration
fail_fast: true
default_stages: [pre-commit]
