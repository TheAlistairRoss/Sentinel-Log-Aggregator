[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-log-aggregator"
description = "Azure SDK-compliant Microsoft Sentinel Log Aggregation Client Library"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Microsoft Sentinel Team", email = "your-email@microsoft.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: System :: Monitoring",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
requires-python = ">=3.8"
dependencies = [
    "azure-identity>=1.25.0",
    "azure-monitor-query>=2.0.0", 
    "azure-monitor-ingestion>=1.1.0",
    "azure-core>=1.30.0",
    "azure-core-tracing-opentelemetry>=1.0.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0",
    "aiohttp>=3.13.0",
    "packaging>=21.0",
    "pydantic>=2.0.0",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "pre-commit>=3.0.0",
    "bandit>=1.7.0",
]
docs = [
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.3.0",
    "myst-parser>=2.0.0",
]

[project.scripts]
sentinel-aggregator = "sentinel_log_aggregator.cli:main"

[project.urls]
"Bug Reports" = "https://github.com/your-org/sentinel-log-aggregator/issues"
"Source" = "https://github.com/your-org/sentinel-log-aggregator"
"Documentation" = "https://your-org.github.io/sentinel-log-aggregator/"

[tool.setuptools.dynamic]
version = {attr = "sentinel_log_aggregator.version.__version__"}

[tool.setuptools.packages.find]
include = ["sentinel_log_aggregator*"]

[tool.setuptools.package-data]
sentinel_log_aggregator = ["py.typed", "queries/*.yaml"]

# Black configuration
[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.venv
  | build
  | dist
)/
'''

# isort configuration  
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

# mypy configuration
[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "--strict-markers",
    "--strict-config", 
    "--cov=sentinel_log_aggregator",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=80"
]
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "slow: marks tests as slow",
]

# Coverage configuration
[tool.coverage.run]
source = ["sentinel_log_aggregator"]
omit = [
    "tests/*",
    "setup.py",
    "*/migrations/*",
    "*/__pycache__/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]