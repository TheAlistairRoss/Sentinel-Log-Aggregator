[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-log-aggregator"
description = "Azure SDK-compliant Microsoft Sentinel Log Aggregation Client Library"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Alistair Ross", email = "thealistairross@outlook.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
requires-python = ">=3.11"
dependencies = [
    "azure-identity>=1.25.0",
    "azure-monitor-query>=2.0.0", 
    "azure-monitor-ingestion>=1.1.0",
    "azure-core>=1.30.0",
    "aiohttp>=3.13.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0",
    "pydantic>=2.0.0",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "pre-commit>=3.0.0",
    "bandit>=1.7.0",
]
security = [
    "bandit[toml]>=1.7.0",
    "safety>=2.3.0",
    "pip-audit>=2.6.0",
    "semgrep>=1.45.0",
    "detect-secrets>=1.4.0",
    "pip-licenses>=4.3.0",
]
docs = [
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.3.0",
    "myst-parser>=2.0.0",
]

[project.scripts]
sentinel-aggregator = "sentinel_log_aggregator.cli:main"

[project.urls]
"Homepage" = "https://github.com/TheAlistairRoss/Sentinel-Log-Aggregator"
"Bug Reports" = "https://github.com/TheAlistairRoss/Sentinel-Log-Aggregator/issues"
"Source" = "https://github.com/TheAlistairRoss/Sentinel-Log-Aggregator"
"Documentation" = "https://thealistairross.github.io/Sentinel-Log-Aggregator/"
"Download" = "https://github.com/TheAlistairRoss/Sentinel-Log-Aggregator/releases"
"Changelog" = "https://github.com/TheAlistairRoss/Sentinel-Log-Aggregator/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {attr = "sentinel_log_aggregator.version.__version__"}

[tool.setuptools.packages.find]
include = ["sentinel_log_aggregator*"]

[tool.setuptools.package-data]
sentinel_log_aggregator = ["py.typed", "queries/*.yaml"]

# Black configuration
[tool.black]
line-length = 100
target-version = ['py311', 'py312', 'py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.venv
  | build
  | dist
)/
'''

# isort configuration  
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

# mypy configuration
[tool.mypy]
python_version = "3.11"
warn_return_any = false  # Temporarily disabled for CI stability
warn_unused_configs = true
disallow_untyped_defs = false  # Temporarily disabled - tracked in mypy_errors.txt
disallow_incomplete_defs = false  # Temporarily disabled - tracked in mypy_errors.txt
check_untyped_defs = true
disallow_untyped_decorators = false  # Temporarily disabled - tracked in mypy_errors.txt
no_implicit_optional = false  # Temporarily disabled - tracked in mypy_errors.txt
warn_redundant_casts = true
warn_unused_ignores = false  # Temporarily disabled - tracked in mypy_errors.txt
warn_no_return = false  # Temporarily disabled - tracked in mypy_errors.txt
warn_unreachable = false  # Temporarily disabled - tracked in mypy_errors.txt
strict_equality = true
show_error_codes = true
# TODO: Re-enable strict type checking after addressing issues in mypy_errors.txt

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "--strict-markers",
    "--strict-config", 
    "--cov=sentinel_log_aggregator",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=80"
]
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "slow: marks tests as slow",
]

# Coverage configuration
[tool.coverage.run]
source = ["sentinel_log_aggregator"]
omit = [
    "tests/*",
    "setup.py",
    "*/migrations/*",
    "*/__pycache__/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

# Security tools configuration
[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv", "env", ".env", "build", "dist"]
skips = ["B101", "B601"]

[tool.safety]
ignore = []
continue-on-error = false
full-report = false

[tool.semgrep]
config = ["p/security-audit", "p/secrets", "p/python"]