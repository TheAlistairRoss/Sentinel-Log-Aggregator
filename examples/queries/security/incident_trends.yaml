name: "security_incident_trends"
destination_stream: "Custom-SecurityTrends_CL"
stream_name: "stream_security_trends"
description: "Analyzes security incident trends over time with severity breakdown"
version: "1.2"
tags: ["security", "incidents", "trends", "analytics"]

parameters:
  row_level_security_tag:
    type: "string"
    required: false
    default: ""
    description: "Workspace identifier for data isolation"
  
  time_window_days:
    type: "int"
    required: false
    default: 30
    description: "Number of days to analyze for trends"
  
  severity_filter:
    type: "string"
    required: false
    default: "High,Critical"
    description: "Comma-separated list of severity levels to include"

query: |
  let timeWindow = {time_window_days}d;
  let severities = split("{severity_filter}", ",");
  
  SecurityIncident
  | where TimeGenerated > ago(timeWindow)
  | where Severity in (severities)
  | join kind=inner (
      SecurityAlert
      | where TimeGenerated > ago(timeWindow)
  ) on $left.AlertIds == $right.SystemAlertId
  
  | summarize 
      IncidentCount = count(),
      OpenIncidents = countif(Status in ("New", "Active")),
      ClosedIncidents = countif(Status == "Closed"),
      HighSeverityCount = countif(Severity == "High"),
      CriticalSeverityCount = countif(Severity == "Critical"),
      AverageTimeToClose = avg(iff(Status == "Closed", datetime_diff('hour', CreatedTime, ClosedTime), real(null))),
      UniqueAffectedEntities = dcount(PrimaryEntityId)
      by bin(TimeGenerated, 1d), Severity
  
  | extend 
      WorkspaceTag = "{row_level_security_tag}",
      TrendDate = format_datetime(TimeGenerated, 'yyyy-MM-dd'),
      AnalysisWindow = "{time_window_days} days",
      SeverityFilter = "{severity_filter}"
  
  | order by TimeGenerated desc, Severity asc