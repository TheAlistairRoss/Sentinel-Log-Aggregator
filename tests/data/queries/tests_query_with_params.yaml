name: "tests_query_with_params"
destination_stream: "Custom-Reports_LogAggregatorHealth_CL"
description: "Used for log aggregator unit testing. This query is used for testing parameter replacement"
stream_name: "stream_workspace_usage"

parameters:
  non_required_param:
    type: "string"
    required: false
    default: ""
    description: "Non required workspace parameter"
  required_param:
    type: "string"
    required: true
    description: "Required workspace parameter"
query: |
    // Test query with parameters for unit testing
    Usage
    | where TimeGenerated > ago(30d)
    | extend RequiredParam = "{required_param}"
    | extend NonRequiredParam = "{non_required_param}"
    | extend Operation = "TestOperation"
    | project TimeGenerated, DataType, Quantity, RequiredParam, NonRequiredParam, Operation
    | limit 100
    //
    print "Test query with parameters"
    | extend RequiredParam = "{required_param}"
    | extend NonRequiredParam = "{non_required_param}"