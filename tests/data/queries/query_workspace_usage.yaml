name: "query_workspace_usage"
destination_stream: "Custom-Reports_WorkspaceUsage_CL"
stream_name: "stream_workspace_usage"
description: "Test query for workspace usage analysis - used in unit tests"
report_name: "report_workspace_usage"

parameters:
  row_level_security_tag:
    type: "string"
    required: false
    default: ""
    description: "Row level security tag for data isolation"
  days_back:
    type: "int"
    required: false
    default: 7
    description: "Number of days to look back"

query: |
  Usage
  | where TimeGenerated >= ago({days_back}d)
  | join kind=inner (
    Operation
    | where TimeGenerated >= ago({days_back}d)
    | project OperationName, CorrelationId
  ) on CorrelationId
  | summarize 
      TotalDataIngestedGB = sum(Quantity) / 1024,
      UniqueDataTypes = dcount(DataType),
      IngestionEvents = count(),
      OperationCount = dcount(OperationName)
  by bin(TimeGenerated, 1d)
  | extend RowLevelSecurityTag = "{row_level_security_tag}"
  | extend ProcessedTime = now()