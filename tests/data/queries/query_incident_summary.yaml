name: "query_incident_summary"
destination_stream: "Custom-Reports_IncidentDetails_CL"
stream_name: "stream_incident_summary"
description: "Test query for incident summary - used in unit tests"
report_name: "report_incident_summary"

parameters:
  row_level_security_tag:
    type: "string"
    required: false
    default: ""
    description: "Row level security tag for data isolation"
  hours_back:
    type: "int"
    required: false
    default: 24
    description: "Number of hours to look back"

query: |
  SecurityIncident
  | where TimeGenerated >= ago({hours_back}h)
  | join kind=inner (
    SecurityAlert
    | where TimeGenerated >= ago({hours_back}h)
    | project AlertName = DisplayName, SystemAlertId
  ) on $left.LastModifiedTime == $right.TimeGenerated
  | project TimeGenerated, IncidentNumber, Title, Severity, Status, AlertName
  | extend RowLevelSecurityTag = "{row_level_security_tag}"
  | summarize 
      TotalIncidents = count(),
      HighSeverityIncidents = countif(Severity == "High"),
      OpenIncidents = countif(Status == "New" or Status == "Active")
  | extend ProcessedTime = now()